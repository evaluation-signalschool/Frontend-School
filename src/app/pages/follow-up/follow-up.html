<div class="page-container">
  <div class="header">
    <h1>แบบประเมินติดตามผู้สำเร็จ: {{ courseName || 'ทั้งหมด' }} {{ batchName }}</h1>
  </div>
</div>
<div class="card-container">
  <!-- Card 1: สำหรับผู้บังคับบัญชา (ผบช.) -->
  <div class="info-card">
    <div class="card-icon icon-boss">
      <span class="material-icons">supervisor_account</span>
    </div>
    <div class="card-content">
      <h3>แบบประเมินผู้สำเร็จการฝึกอบรม (สำหรับ ผบช.)</h3>
      <button class="card-btn" (click)="goToForm('followup_commander')">ประเมิน</button>
    </div>
  </div>

  <!-- Card 2: ผู้ฝึกอบรมประเมินตนเอง -->
  <div class="info-card">
    <div class="card-icon icon-self">
      <span class="material-icons">account_box</span>
    </div>
    <div class="card-content">
      <h3>แบบประเมินผู้สำเร็จการฝึกอบรม (ผู้ฝึกอบรมประเมินตนเอง)</h3>
      <button class="card-btn" (click)="goToForm('followup_self')">ประเมิน</button>
    </div>
  </div>

  <!-- Card 3: สำหรับเพื่อนร่วมงาน -->
  <div class="info-card">
    <div class="card-icon icon-peer">
      <span class="material-icons">groups</span>
    </div>
    <div class="card-content">
      <h3>แบบประเมินผู้สำเร็จการฝึกอบรม (สำหรับเพื่อนร่วมงาน)</h3>
      <button class="card-btn" (click)="goToForm('followup_colleague')">ประเมิน</button>
    </div>
  </div>
</div>
