<div class="register-container">
  <!-- Header Section -->
  <header class="header">
    <h1 class="title">ลงทะเบียน</h1>
    <div class="course-context" *ngIf="courseName">
      <p class="course-name"><strong>หลักสูตร:</strong> {{ courseName }}</p>
      <p class="batch-name"><strong>รุ่น:</strong> {{ batchName }}</p>
    </div>
  </header>

  <!-- Form Section -->
  <form (submit)="onSubmit($event)" class="form-content">
    
    <!-- Row 1: ยศ และ ชื่อ-สกุล -->
    <div class="row-two-cols">
      <div class="input-group flex-1">
        <label for="rank">ยศ</label>
        <input type="text" id="rank" name="rank" placeholder="" [(ngModel)]="formData.rank" />
         <small class="hint-text"> *กรุณาระบุชื่อยศเต็ม </small>
      </div>
      <div class="input-group flex-2">
        <label for="fullName">ชื่อ-สกุล</label>
        <input type="text" id="fullName" name="fullName" placeholder="" [(ngModel)]="formData.fullName" required />
      </div>
    </div>

    <!-- Row 2: หน่วยต้นสังกัด -->
    <div class="input-group">
      <label for="affiliation">หน่วยต้นสังกัด</label>
      <input type="text" id="affiliation" name="affiliation" placeholder="" [(ngModel)]="formData.affiliation" required />
    </div>

    <!-- Row 3: เบอร์โทร -->
    <div class="input-group">
      <label for="phone">เบอร์โทรศัพท์</label>
      <input type="tel" id="phone" name="phone" placeholder="" [(ngModel)]="formData.phone" pattern="[0-9]{9,10}" required />
    </div>

    <!-- Row 4: อีเมล -->
    <div class="input-group">
      <label for="email">อีเมล</label>
      <input type="email" id="email" name="email" placeholder="" [(ngModel)]="formData.email" required />
    </div>

    <!-- Row 5: รหัสผ่าน -->
    <div class="input-group password-group">
      <label for="password">
        รหัสผ่าน 
        <span class="required-asterisk">*</span>
      </label>
      
      <div class="password-input-wrapper">
        <input 
          id="password"
          [type]="showPassword ? 'text' : 'password'" 
          name="password" 
          placeholder="" 
          [(ngModel)]="formData.password"
          maxlength="10"
          minlength="10"
          required
        />
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" aria-label="Toggle password">
          
          <!-- 1. ไอคอนปิดตา (Eye Off) - แสดงตอนซ่อนรหัสผ่าน -->
          <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <path d="M10.33 10.33a3 3 0 0 0 4.24 4.24"></path>
          </svg>

          <!-- 2. ไอคอนเปิดตา (Eye) - แสดงตอนแสดงรหัสผ่าน -->
          <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>

      <!-- ข้อความคำแนะนำการตั้งรหัสผ่าน -->
      <small class="hint-text"> *กรุณาใส่รหัสผ่านเป็นเลขประจำตัวทหาร 10 หลัก หรือ ตั้งรหัสผ่านได้ด้วยตนเอง </small>
    </div>

    <!-- Submit Button -->
    <div class="action-container">
      <button type="submit" class="submit-btn">
        ยืนยัน
      </button>
    </div>

  </form>
</div>
