<div class="special-score-dialog-container">
  <div class="dialog-header">
    <div class="header-title">
      <mat-icon class="header-icon">edit_note</mat-icon>
      <h2>บันทึกคะแนนพิเศษทั้งรุ่น</h2>
    </div>
    <button mat-icon-button (click)="onClose()" class="close-btn" [disabled]="isSaving">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <div class="table-container">
      <table class="special-score-table">
        <thead>
          <tr>
            <th class="text-center" style="width: 60px;">ลำดับ</th>
            <th class="text-left">ยศ-ชื่อ-นามสกุล</th>
            <th class="text-center" style="width: 120px;">ฝึกอบรม (100)</th>
            <th class="text-center" style="width: 120px;">เวลาสอบ (100)</th>
            <th class="text-center" style="width: 130px;">ความประพฤติ (200)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let student of students; let i = index">
            <td class="text-center">{{ i + 1 }}</td>

            <td class="text-left font-medium">
              <span *ngIf="student.rank" style="font-weight: 500; font-size: 13px; color: #8e44ad; background-color: #f0e6f7; padding: 2px 6px; border-radius: 4px; margin-right: 6px;">{{ student.rank }}</span>
              {{ student.name }}
            </td>
            <td class="text-center">
              <input type="number" class="score-input" [(ngModel)]="student.trainingTimeScore" (input)="validateScore(student, 'trainingTimeScore', 100, $event)" max="100" min="0" placeholder="-">
            </td>
            <td class="text-center">
              <input type="number" class="score-input" [(ngModel)]="student.examTimeScore" (input)="validateScore(student, 'examTimeScore', 100, $event)" max="100" min="0" placeholder="-">
            </td>
            <td class="text-center">
              <input type="number" class="score-input" [(ngModel)]="student.behaviorScore" (input)="validateScore(student, 'behaviorScore', 200, $event)" max="200" min="0" placeholder="-">
            </td>
          </tr>
          <tr *ngIf="students.length === 0">
            <td colspan="5" class="text-center text-muted py-4" style="padding: 30px;">ไม่พบรายชื่อนักเรียน</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="dialog-footer">
    <button mat-button class="btn-cancel" (click)="onClose()" [disabled]="isSaving">ยกเลิก</button>
    <button mat-raised-button class="btn-save" (click)="saveScores()" [disabled]="isSaving || students.length === 0">
      <mat-icon *ngIf="!isSaving">save</mat-icon>
      <mat-icon *ngIf="isSaving" class="spinning">sync</mat-icon>
      <span>{{ isSaving ? 'กำลังบันทึก...' : 'บันทึกข้อมูล' }}</span>
    </button>
  </div>
</div>
